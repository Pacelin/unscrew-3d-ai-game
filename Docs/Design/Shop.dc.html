<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ibtn{width:56px;height:56px;border-radius:20px;border:0;display:flex;align-items:center;justify-content:center;background:#2F80ED;box-shadow:0 6px 0 #1E5DB3;color:#FFFFFF;padding:0}
.pill{height:56px;border-radius:999px;background:#FFFFFF;box-shadow:0 4px 0 #C5D2E0;display:flex;align-items:center;gap:8px;padding:0 8px;box-sizing:border-box}
.card{box-sizing:border-box;height:312px;padding:24px 16px 16px;border-radius:28px;background:#FFFFFF;box-shadow:0 6px 0 #C5D2E0;display:flex;flex-direction:column;align-items:center;gap:8px}
.ico{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.name{margin:0;font-size:22px;font-weight:600}
.desc{margin:0;font-size:15px;font-weight:500;color:#4A5568;text-align:center;line-height:1.3;flex:1}
.buy{width:100%;height:56px;border:0;border-radius:20px;font-family:inherit;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;color:#FFFFFF;background:#1F9D55;box-shadow:0 6px 0 #15703C}
</style>
</helmet>
<div style="width: 540px; height: 960px; position: relative; overflow: hidden; background: #D6E8F7; font-family: 'Fredoka', system-ui, sans-serif; color: #1E2A3B">

  <div style="position: absolute; top: 24px; left: 20px; right: 20px; height: 56px; display: flex; align-items: center; justify-content: space-between">
    <button class="ibtn" aria-label="Back">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 32px; font-weight: 700">Shop</h1>
    <div class="pill">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#FFC233" stroke="#D99A0B" stroke-width="3"></circle><rect x="15" y="10" width="6" height="16" rx="3" fill="#D99A0B"></rect></svg>
      <span style="font-size: 24px; font-weight: 600; min-width: 48px; text-align: right; padding-right: 8px">120</span>
    </div>
  </div>

  <div style="position: absolute; top: 104px; left: 20px; right: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <div class="card">
      <div class="ico" style="background: #DCEBFF"><svg width="64" height="64" viewBox="0 0 56 56" aria-hidden="true"><circle cx="26" cy="30" r="18" fill="#2A3444" stroke="#9DB1C7" stroke-width="4"></circle><circle cx="42" cy="14" r="10" fill="#1F9D55"></circle><path d="M42 9v10M37 14h10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path></svg></div>
      <p class="name">+1 Hole</p>
      <p class="desc">One more buffer hole for this level</p>
      <button class="buy"><svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#FFC233" stroke="#D99A0B" stroke-width="3"></circle><rect x="15" y="10" width="6" height="16" rx="3" fill="#D99A0B"></rect></svg>90</button>
    </div>
    <div class="card">
      <div class="ico" style="background: #FFE3C2"><svg width="64" height="64" viewBox="0 0 56 56" fill="none" stroke="#9A4500" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h26v12H8z"></path><path d="M34 22l12 4-12 4"></path><path d="M16 32l-4 14h8l4-14"></path></svg></div>
      <p class="name">Drill</p>
      <p class="desc">Remove any bolt, even a blocked one</p>
      <button class="buy" style="background: #E8EEF5; color: #4A5568; box-shadow: 0 6px 0 #C5D2E0"><svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#FFC233" stroke="#D99A0B" stroke-width="3"></circle><rect x="15" y="10" width="6" height="16" rx="3" fill="#D99A0B"></rect></svg><span style="color: #B4232E">150</span></button>
    </div>
    <div class="card">
      <div class="ico" style="background: #E8EEF5; position: relative">
        <svg width="64" height="64" viewBox="0 0 56 56" fill="none" stroke="#8A97A8" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M14 10v18a14 14 0 0 0 28 0V10"></path><path d="M10 10h8M38 10h8"></path></svg>
        <span style="position: absolute; right: -6px; bottom: -6px; width: 36px; height: 36px; border-radius: 999px; background: #4A5568; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF"><svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" aria-hidden="true"><rect x="7" y="14" width="18" height="13" rx="3"></rect><path d="M11 14v-4a5 5 0 0 1 10 0v4"></path></svg></span>
      </div>
      <p class="name" style="color: #4A5568">Magnet</p>
      <p class="desc">Fills the left box with matching bolts</p>
      <div style="width: 100%; height: 56px; border-radius: 20px; background: #E8EEF5; color: #4A5568; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center">Unlocks at level 7</div>
    </div>
    <div class="card">
      <div class="ico" style="background: #FFF4D6"><svg width="72" height="72" viewBox="0 0 56 56" aria-hidden="true"><circle cx="22" cy="32" r="14" fill="#FFC233" stroke="#D99A0B" stroke-width="3"></circle><circle cx="34" cy="24" r="14" fill="#FFC233" stroke="#D99A0B" stroke-width="3"></circle><rect x="31" y="16" width="6" height="16" rx="3" fill="#D99A0B"></rect></svg></div>
      <p class="name">+25 coins</p>
      <p class="desc">Watch a short video</p>
      <button class="buy" style="background: #2F80ED; box-shadow: 0 6px 0 #1E5DB3"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>Free</button>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; justify-content: center">
    <div style="height: 56px; padding: 0 24px; border-radius: 999px; background: #1E2A3B; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px">Not enough coins — watch a video for +25</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
