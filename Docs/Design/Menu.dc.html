<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ibtn{width:56px;height:56px;border-radius:20px;border:0;display:flex;align-items:center;justify-content:center;background:#2F80ED;box-shadow:0 6px 0 #1E5DB3;color:#FFFFFF;padding:0}
.pill{height:56px;border-radius:999px;background:#FFFFFF;box-shadow:0 4px 0 #C5D2E0;display:flex;align-items:center;gap:8px;padding:0 8px;box-sizing:border-box}
</style>
</helmet>
<div style="width: 540px; height: 960px; position: relative; overflow: hidden; background: #D6E8F7; font-family: 'Fredoka', system-ui, sans-serif; color: #1E2A3B">

  <div style="position: absolute; top: 24px; left: 20px; right: 20px; height: 56px; display: flex; align-items: center; justify-content: space-between">
    <button class="ibtn" aria-label="Settings">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
    <div class="pill">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#FFC233" stroke="#D99A0B" stroke-width="3"></circle><rect x="15" y="10" width="6" height="16" rx="3" fill="#D99A0B"></rect></svg>
      <span style="font-size: 24px; font-weight: 600; min-width: 48px; text-align: right">202</span>
      <button aria-label="Get coins" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: #1F9D55; box-shadow: 0 3px 0 #15703C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 3v12M3 9h12"></path></svg>
      </button>
    </div>
  </div>

  <div style="position: absolute; top: 112px; left: 20px; right: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <span style="font-size: 56px; font-weight: 700; line-height: 1; color: #1E2A3B; letter-spacing: 1px">UNSCREW</span>
    <span style="height: 32px; padding: 0 16px; border-radius: 999px; background: #2F80ED; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center">3D puzzle</span>
  </div>

  <div style="position: absolute; top: 224px; left: 20px; right: 20px; height: 480px; border-radius: 28px; border: 2px dashed #9DB1C7; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
    <span style="font-size: 16px; font-weight: 500; color: #4A5568">Current level model, slow turntable</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: center">
      <span style="height: 40px; padding: 0 20px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 0 #C5D2E0; font-size: 22px; font-weight: 600; display: flex; align-items: center">Level 6</span>
    </div>
    <div style="display: flex; gap: 16px">
      <button aria-label="Shop" style="width: 88px; height: 88px; border-radius: 24px; border: 0; background: #FFFFFF; box-shadow: 0 6px 0 #C5D2E0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; color: #1E2A3B">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h2l2.5 11h11L21 8H7"></path><circle cx="9.5" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle></svg>
        <span style="font-size: 16px; font-weight: 600">Shop</span>
      </button>
      <button style="flex: 1; height: 88px; border-radius: 24px; border: 0; background: #1F9D55; box-shadow: 0 6px 0 #15703C; color: #FFFFFF; font-family: inherit; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>
        Play
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
